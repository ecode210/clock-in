<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Clock-In">
  <!-- Same mark as web/icon.svg, redrawn for 16-32px: a heavier stroke and a
       larger dial, because the app icon's hairline vanishes at tab size. -->
