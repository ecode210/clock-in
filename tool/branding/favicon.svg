  <g fill="none" stroke="#FAFAFA" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="166"/>
    <path d="M256 152 V256 L326 300"/>
  </g>
</svg>
