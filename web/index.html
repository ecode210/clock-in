<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the `--base-href` argument to `flutter build`, and "/" by
    default. It has to stay, because the icon and manifest links below are
    relative and the app now serves real paths such as /admin/attendance.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    No viewport tag here on purpose: the Flutter engine inserts its own at
    startup, and a second one would compete with it. After load, the script
    below adds interactive-widget=resizes-content to that injected tag so
    Chrome Android resizes the layout viewport with the keyboard.
  -->

  <style>
    /* Lock the document so mobile browsers cannot pan away from the Flutter
       view when the soft keyboard opens (that pan shows as a solid gap). */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      background-color: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0A0A0A;
      }
    }
  </style>

  <title>Clock-In: geofenced staff attendance</title>
  <meta name="description" content="Staff clock in and out only from inside your workplace geofence, verified by live selfie and passkey, while admins track hours and attendance in real time.">
  <link rel="canonical" href="https://clockin.syncup.com.ng/">

  <!-- Tints browser and OS chrome to match the app's light and dark themes. -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Link previews in chat apps and social cards. og:image must be absolute. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Clock-In">
  <meta property="og:title" content="Clock-In: geofenced staff attendance">
  <meta property="og:description" content="Staff clock in and out only from inside your workplace geofence, verified by live selfie and passkey.">
  <meta property="og:url" content="https://clockin.syncup.com.ng/">
  <meta property="og:image" content="https://clockin.syncup.com.ng/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Clock-In, geofenced staff attendance">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Clock-In: geofenced staff attendance">
  <meta name="twitter:description" content="Staff clock in and out only from inside your workplace geofence, verified by live selfie and passkey.">
  <meta name="twitter:image" content="https://clockin.syncup.com.ng/og-image.png">

  <!-- Installed app: iOS reads these, Android reads the manifest. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clock-In">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- SVG first for crisp tabs, with rasters for browsers that ignore it. -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="any">

  <link rel="manifest" href="manifest.json">

  <!--
    WebAuthn bridge for the `passkeys` plugin. Without this script the
    PasskeyAuthenticator cannot initialise and passkey sign-in fails on web.
    See https://pub.dev/packages/passkeys#web
  -->
  <script
    src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"
    type="application/javascript"
  ></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      function resetScroll() {
        window.scrollTo(0, 0);
        if (document.documentElement) document.documentElement.scrollTop = 0;
        if (document.body) document.body.scrollTop = 0;
      }

      function patchViewportMeta() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var content = meta.getAttribute('content') || '';
        if (content.indexOf('interactive-widget') === -1) {
          meta.setAttribute(
            'content',
            content + ', interactive-widget=resizes-content'
          );
        }
      }

      window.addEventListener('scroll', resetScroll, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('scroll', resetScroll, {
          passive: true,
        });
        window.visualViewport.addEventListener('resize', function () {
          resetScroll();
          patchViewportMeta();
        }, { passive: true });
      }
      document.addEventListener('focusin', function () {
        setTimeout(resetScroll, 50);
        setTimeout(resetScroll, 300);
      });
      document.addEventListener('focusout', function () {
        setTimeout(resetScroll, 50);
        setTimeout(resetScroll, 300);
      });

      var head = document.head;
      if (head && window.MutationObserver) {
        new MutationObserver(patchViewportMeta).observe(head, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['content'],
        });
      }
      patchViewportMeta();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
