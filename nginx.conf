server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Geolocation, the camera and passkeys all refuse to run on an insecure
  # origin, so the proxy in front of this server must terminate TLS.

  # Caching note: Flutter does not fingerprint its output. Every build writes
  # the same main.dart.js, assets and canvaskit paths, so none of it can be
  # served as immutable; a redeploy would leave returning staff on the previous
  # bundle until the cache expired. Those files revalidate instead, which costs
  # one conditional request and still reuses the local copy on a 304.

  # The shell, the loader and the worker version decide which build runs.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-store";
  }
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store";
  }
  location = /version.json {
    add_header Cache-Control "no-store";
  }

  location ^~ /assets/ {
    add_header Cache-Control "no-cache";
  }
  location ^~ /canvaskit/ {
    add_header Cache-Control "no-cache";
  }

  # Branding is ours rather than Flutter's: the contents are stable, and a
  # rename is enough to bust them if they ever change.
  location ^~ /icons/ {
    add_header Cache-Control "public, max-age=604800";
  }
  location ~* ^/(?:favicon\.(?:ico|png)|icon\.svg|og-image\.png)$ {
    add_header Cache-Control "public, max-age=604800";
  }

  # main.dart.js and flutter.js.
  location ~* \.js$ {
    add_header Cache-Control "no-cache";
  }

  # Real paths such as /admin/attendance are routed by the app, so every
  # unmatched request returns the shell rather than a 404.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm application/xml;
  gzip_min_length 1024;
}
