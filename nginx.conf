server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Geolocation, the camera and passkeys all refuse to run on an insecure
  # origin, so the proxy in front of this server must terminate TLS.
  #
  # Flutter writes the same filenames every build (main.dart.js never gets a
  # hash). Cloudflare is in front of this origin and will cache whatever we
  # allow, so the shell and the JS bundle are never stored at the edge or in
  # the browser. A 304 on a hashed file would be cheaper; we do not have hashed
  # files.

  # The shell, the loader and the worker version decide which build runs.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }
  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }
  location = /flutter.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }
  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }

  location = /manifest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }

  location ^~ /assets/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }
  location ^~ /canvaskit/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }

  # Branding is ours rather than Flutter's: the contents are stable, and a
  # rename is enough to bust them if they ever change.
  location ^~ /icons/ {
    add_header Cache-Control "public, max-age=604800" always;
  }
  location ~* ^/(?:favicon\.(?:ico|png)|icon\.svg|og-image\.png)$ {
    add_header Cache-Control "public, max-age=604800" always;
  }

  # main.dart.js and any other unhashed scripts.
  location ~* \.js$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
  }

  # Real paths such as /admin/attendance are routed by the app, so every
  # unmatched request returns the shell rather than a 404.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm application/xml;
  gzip_min_length 1024;
}
