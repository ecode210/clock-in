server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Geolocation, the camera and passkeys all refuse to run on an insecure
  # origin, so the proxy in front of this server must terminate TLS.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Flutter revs these filenames per build, so long caching is safe. Set in one
  # header rather than alongside `expires`, which would emit a second one.
  location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2|ttf|otf|wasm)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # The shell and the worker decide which build a browser runs, so a cached
  # copy would pin returning staff to an old bundle.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store";
  }

  location = /version.json {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm;
  gzip_min_length 1024;
}
